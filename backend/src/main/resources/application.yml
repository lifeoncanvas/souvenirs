server:
  port: ${PORT:8090}
  # Trust X-Forwarded-For/-Proto only from a reverse proxy on a private network (Tomcat's default
  # internal-proxy ranges), so rate limits see the real client IP and HTTPS is detected for HSTS.
  # Set to "none" when the API is exposed directly to the internet.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: licht-souvenirs-api
  config:
    # Local secrets (Neon connection string, JWT secret...) live in backend/.env — never commit it.
    import: optional:file:.env[.properties]
  # Database: Neon serverless PostgreSQL. Set DATABASE_URL to the connection string from the Neon
  # console (postgresql://user:password@ep-xxx.region.aws.neon.tech/neondb?sslmode=require);
  # NeonDataSourceEnvironment converts it to JDBC settings.
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon computes scale to zero; the first connection after idle can take a few seconds.
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_SIZE:3}
      # Set minimum-idle to 0 so all connections are closed when idle, allowing Neon
      # serverless compute to auto-suspend and consume zero data / compute hours when inactive.
      minimum-idle: ${DB_MIN_IDLE:0}
      idle-timeout: 30000
      max-lifetime: 600000
  # Schema changes are versioned in src/main/resources/db/migration. A database created before
  # Flyway (by ddl-auto=update) is baselined at version 1, so only later migrations run on it.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
        # Load lazy associations (images, categories, personalisation) for a whole page in one query
        # instead of one per product — essential when every round trip goes to a remote Neon region.
        default_batch_fetch_size: 64
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    # Required: a long random value (>= 32 bytes). There is deliberately no default — the app refuses
    # to start without one, so a published fallback key can never sign production tokens.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # ISO 4217 code the shop charges in; must match the "store" content block shown on the storefront.
  currency: ${STORE_CURRENCY:GBP}
  mail:
    from: ${MAIL_FROM:no-reply@licht-signature.local}
    admin-notify: ${ADMIN_NOTIFY_EMAIL:}
    # Without SMTP, emails are logged instead of sent. Bodies hold reset/verification links, so they
    # are only written to the log when this is true (the local profile turns it on).
    log-bodies: ${MAIL_LOG_BODIES:false}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:/uploads}
    # Customer logos not referenced by any bag or order after this many hours are deleted.
    orphan-logo-hours: ${ORPHAN_LOGO_HOURS:48}
  captcha:
    # Cloudflare Turnstile secret. When set, sign-up, password reset, enquiries and checkout require a
    # token (the frontend needs VITE_TURNSTILE_SITE_KEY). Leave empty to disable.
    turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  payment:
    # Bank transfer and pay-on-confirmation are always available; PayPal is offered once its
    # credentials are set. No card data ever touches this server.
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      # "sandbox" for testing, "live" for real payments.
      mode: ${PAYPAL_MODE:sandbox}
      # Developer dashboard → your app → Webhooks. Required to receive capture/refund events.
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
      brand-name: ${PAYPAL_BRAND_NAME:LICHT Signature Souvenirs}
  orders:
    # Unpaid orders still PENDING are cancelled and restocked after this long, so stock cannot be
    # held indefinitely by orders that are never paid. Confirm an order in the admin to keep it.
    unpaid-expiry-hours: ${UNPAID_ORDER_EXPIRY_HOURS:168}
    # An abandoned PayPal checkout releases its stock after this many minutes.
    paypal-expiry-minutes: ${PAYPAL_ORDER_EXPIRY_MINUTES:60}
    # Largest quantity of one product per order; larger quantities go through bulk enquiries.
    max-quantity-per-product: ${MAX_QUANTITY_PER_PRODUCT:100}
    # Guest bags untouched for this many days are deleted.
    guest-cart-days: ${GUEST_CART_DAYS:30}
  shipping:
    standard-fee: ${SHIPPING_STANDARD_FEE:8.00}
    express-fee: ${SHIPPING_EXPRESS_FEE:18.00}
    free-threshold: ${SHIPPING_FREE_THRESHOLD:150.00}
  seed:
    # Seeds placeholder catalogue/content only into empty tables, so it is safe to leave on.
    enabled: ${SEED_ENABLED:true}
    admin-email: ${ADMIN_EMAIL:admin@licht.local}
    admin-password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
    enabled: ${API_DOCS_ENABLED:false}
  api-docs:
    path: /api/docs/openapi.json
    enabled: ${API_DOCS_ENABLED:false}

---
# Optional offline fallback: embedded H2 file database (run with SPRING_PROFILES_ACTIVE=local).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/licht;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
app:
  jwt:
    # Local development only; any other profile must set JWT_SECRET.
    secret: ${JWT_SECRET:local-profile-only-secret-licht-signature-souvenirs}
  mail:
    log-bodies: true
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
