# Fresh in-memory database per test run; Flyway builds it from the migrations, Hibernate validates it.
spring.datasource.url=jdbc:h2:mem:licht-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=test-only-secret-licht-signature-souvenirs-0123456789
app.seed.enabled=false
app.seed.admin-email=admin@test.local
app.seed.admin-password=AdminPass123!
app.storage.upload-dir=target/test-uploads
app.mail.log-bodies=false
app.orders.max-quantity-per-product=20
